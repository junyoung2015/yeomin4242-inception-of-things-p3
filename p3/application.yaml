apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playground-app
  namespace: argocd
spec:
  project: default
  destination:
    namespace: dev
    server: https://kubernetes.default.svc
  source:
    # This placeholder is deliberately non-runnable. install_and_setup.sh
    # requires REPO_URL and TARGET_REVISION and renders an ephemeral manifest.
    repoURL: "https://github.com/REPLACE_WITH_GITHUB_OWNER/yeomin4242-inception-of-things-p3.git"
    targetRevision: "main"
    path: "dev"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
